openapi: 3.1.0
info:
  title: SEVEN Operator Plugin
  version: 1.0.0-test
  description: >-
    Private SEVEN browser-control action API. ChatGPT sends authenticated commands to the
    SEVEN Bridge, which routes them to the user's SEVEN Operator browser extension.
servers:
  - url: https://seven-bridge.carlosdh12335.workers.dev
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API-Key
  schemas:
    DeviceCode:
      type: string
      pattern: '^[0-9]{6}$'
      description: Permanent 6-digit SEVEN device code shown by the extension.
    Target:
      type: object
      additionalProperties: false
      properties:
        tabId:
          type: integer
        titleContains:
          type: string
        urlPrefix:
          type: string
        active:
          type: boolean
        locked:
          type: boolean
    Command:
      type: object
      required: [v, action]
      additionalProperties: true
      properties:
        v:
          type: integer
          enum: [1]
        action:
          type: string
          description: >-
            SEVEN action. Common values: capabilities, vision, visionDiff, click, type,
            press, scroll, hover, select, open, navigate, wait, sleep, sequence, mission,
            lock, unlock, readProduct, carouselBrief, bridgePing.
        target:
          $ref: '#/components/schemas/Target'
        locator:
          type: object
          additionalProperties: true
          description: >-
            Element locator. Prefer a fresh vision vref. Also supports selector, label,
            placeholder, role, name, text and exact.
        args:
          type: object
          additionalProperties: true
        steps:
          type: array
          items:
            type: object
            additionalProperties: true
        finalVision:
          oneOf:
            - type: string
              enum: [full, diff]
            - type: boolean
              enum: [false]
        visionMax:
          type: integer
          minimum: 1
          maximum: 500
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: sevenHealth
      summary: Check whether the SEVEN Bridge is online
      security: []
      responses:
        '200':
          description: Bridge health response.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /v1/status:
    get:
      operationId: sevenStatus
      summary: Check a SEVEN browser device status
      description: >-
        Call before browser operations. Returns whether the extension for the device code
        currently has a WebSocket connection to the Bridge.
      parameters:
        - in: query
          name: code
          required: true
          schema:
            $ref: '#/components/schemas/DeviceCode'
      responses:
        '200':
          description: Device status.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Invalid API key.
  /v1/push:
    post:
      operationId: sevenPushCommand
      summary: Send a command to a SEVEN browser device
      description: >-
        Sends one SEVEN command through the Bridge. The returned commandId must then be
        passed to sevenGetResult until the result is completed. For browser interactions,
        vision should normally be requested before click/type so the model can use fresh
        element refs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, command]
              additionalProperties: false
              properties:
                code:
                  $ref: '#/components/schemas/DeviceCode'
                command:
                  $ref: '#/components/schemas/Command'
      responses:
        '200':
          description: Command accepted by the Bridge.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Invalid API key.
  /v1/result:
    get:
      operationId: sevenGetResult
      summary: Read the result of a SEVEN browser command
      description: >-
        Poll this operation after sevenPushCommand. Stop when status is completed. If it is
        still pending, call it again after a short delay.
      parameters:
        - in: query
          name: code
          required: true
          schema:
            $ref: '#/components/schemas/DeviceCode'
        - in: query
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Pending or completed command result.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Invalid API key.
