name: one-shot-plugin-migration

on:
  push:
    branches: [main]

jobs:
  trigger:
    if: contains(github.event.head_commit.message, '[run-plugin-menu2]')
    runs-on: ubuntu-latest
    steps:
      - name: Open SEVEN plugin actions menu with keyboard activation
        run: |
          curl --fail --silent --show-error \
            --retry 30 --retry-all-errors --retry-delay 3 \
            "https://seven-bridge.carlosdh12335.workers.dev/internal/one-shot/8f73d2c65aa74c46b5370fef95bcf89b?mode=menu"
