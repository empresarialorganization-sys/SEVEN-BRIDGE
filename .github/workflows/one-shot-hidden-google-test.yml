name: one-shot-hidden-google-test

on:
  push:
    branches: [main]

jobs:
  hidden-google-test:
    if: contains(github.event.head_commit.message, '[run-hidden-google-test]')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger SEVEN Bridge test without touching user focus
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 2 \
            "https://seven-bridge.carlosdh12335.workers.dev/test/r21r9WNzlGHrcrqm8xhXAvx6s3ix24Qf"
